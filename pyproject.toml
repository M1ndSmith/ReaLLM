[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realmm"
version = "0.1.0"
description = "Opinionated LiteLLM operator stack with memory, PII, guards, and a console."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "litellm>=1.97.0,<2",
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.33.0,<1",
    "python-dotenv>=1.0.0,<2",
    "langfuse>=3.0.0,<4",
    "mem0ai>=2.0.0,<3",
    "fastembed>=0.8.0,<1",
    "redis>=5.0.0,<6",
    "presidio-analyzer>=2.2.359,<3",
    "presidio-anonymizer>=2.2.359,<3",
    "jsonschema>=4.23.0,<5",
    "pydantic-settings>=2.0.0,<3",
]

[project.optional-dependencies]
pii = ["spacy>=3.7.0,<4"]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.9.0,<1",
]

[project.urls]
Repository = "https://github.com/M1ndSmith/ReaLLM"
Issues = "https://github.com/M1ndSmith/ReaLLM/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p pytest_cov keeps coverage when PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
# (needed if ROS or other system pytest plugins are on PYTHONPATH).
addopts = [
    "-p", "pytest_cov",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]
extend-exclude = ["web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
